syntax = "proto3";

package shard;

option go_package = "github.com/let-mil-go/proto/shardpb";

// IsolationLevel defines transaction isolation levels.
enum IsolationLevel {
  ISOLATION_UNKNOWN = 0;
  ISOLATION_RA = 1;   // Read Atomic
  ISOLATION_CC = 2;   // Causal Consistency
  ISOLATION_PC = 3;   // Prefix Consistency
  ISOLATION_PSI = 4;  // Parallel Snapshot Isolation
  ISOLATION_SI = 5;   // Snapshot Isolation
  ISOLATION_SER = 6;  // Serializable
}

// ShardService provides transactional KV operations on a shard.
service ShardService {
  // Transaction lifecycle
  rpc TxStart(TxStartRequest) returns (TxStartResponse);

  // Transaction operations (buffered until commit)
  rpc TxRead(TxReadRequest) returns (TxReadResponse);
  rpc TxWrite(TxWriteRequest) returns (TxWriteResponse);
  rpc TxDelete(TxDeleteRequest) returns (TxDeleteResponse);

  // 2PC protocol
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Abort(AbortRequest) returns (AbortResponse);

  // Single-shard fast commit (no 2PC)
  rpc QuickCommit(QuickCommitRequest) returns (QuickCommitResponse);

  // Single-shard abort (no 2PC)
  rpc QuickAbort(QuickAbortRequest) returns (QuickAbortResponse);

  // Shard metadata
  rpc GetCurrentTime(GetCurrentTimeRequest) returns (GetCurrentTimeResponse);
}

// Transaction Start
message TxStartRequest {
  string tx_id = 1;
  IsolationLevel isolation_level = 2;  // Transaction isolation level
  uint64 snapshot_time = 3;            // Required for PC/SI/SER; ignored for PSI
}

message TxStartResponse {
  uint64 start_time = 1;  // Local start time on this shard (for lazy buffer creation)
}

// Transaction Read
message TxReadRequest {
  string tx_id = 1;
  string key = 2;
  uint64 snapshot_time = 3;            // Snapshot time for this shard (from TxStartResponse)
  IsolationLevel isolation_level = 4;  // Transaction isolation level
}

message TxReadResponse {
  string value = 1;
  uint64 version = 2;  // Version of the value read (0 if not found)
  bool found = 3;
}

// Transaction Write (buffered)
message TxWriteRequest {
  string tx_id = 1;
  string key = 2;
  string value = 3;
  uint64 snapshot_time = 4;            // Snapshot time for this shard (from TxStartResponse)
  IsolationLevel isolation_level = 5;  // Transaction isolation level
}

message TxWriteResponse {
  uint64 original_version = 1;  // Version of key before write (0 if not exists)
}

// Transaction Delete (buffered)
message TxDeleteRequest {
  string tx_id = 1;
  string key = 2;
  uint64 snapshot_time = 3;            // Snapshot time for this shard (from TxStartResponse)
  IsolationLevel isolation_level = 4;  // Transaction isolation level
}

message TxDeleteResponse {
  uint64 original_version = 1;  // Version of key before delete (0 if not exists)
}

// WriteOp with original version for CAS validation
message WriteOp {
  string key = 1;
  string value = 2;
  bool deleted = 3;
  uint64 original_version = 4;  // Version when write was buffered
}

// ReadRecord for CAS validation in SER
message ReadRecord {
  string key = 1;
  uint64 version = 2;  // Version that was read
  bool found = 3;
}

// 2PC Prepare
message PrepareRequest {
  string tx_id = 1;
  IsolationLevel isolation_level = 2; // Transaction isolation level
}

message PrepareResponse {
  Vote vote = 1;
  uint64 prepare_time = 2;  // HLC timestamp when prepared
}

enum Vote {
  VOTE_UNKNOWN = 0;
  VOTE_COMMIT = 1;
  VOTE_ABORT = 2;
  VOTE_NOOP = 3;   // No operations need commit on this shard
  VOTE_NOT_FOUND = 4;
}

// 2PC Commit
message CommitRequest {
  string tx_id = 1;
  uint64 commit_time = 2;  // Final commit HLC timestamp
}

message CommitResponse {
  uint64 commit_time = 1;  // Local commit HLC timestamp on this shard
}

// 2PC Abort
message AbortRequest {
  string tx_id = 1;
}

message AbortResponse {}

// Single-shard QuickCommit (no 2PC)
message QuickCommitRequest {
  string tx_id = 1;
  IsolationLevel isolation_level = 2;
}

message QuickCommitResponse {
  uint64 commit_time = 1;  // Commit HLC timestamp
}

// Single-shard QuickAbort (no 2PC)
message QuickAbortRequest {
  string tx_id = 1;
}

message QuickAbortResponse {}

// Shard current time
message GetCurrentTimeRequest {}

message GetCurrentTimeResponse {
  uint64 time = 1;  // Current HLC timestamp
}
