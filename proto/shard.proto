syntax = "proto3";

package shard;

option go_package = "github.com/let-mil-go/proto/shardpb";

// ShardService provides transactional KV operations on a shard.
service ShardService {
  // Transaction operations (buffered until commit)
  rpc TxRead(TxReadRequest) returns (TxReadResponse);
  rpc TxWrite(TxWriteRequest) returns (TxWriteResponse);
  rpc TxDelete(TxDeleteRequest) returns (TxDeleteResponse);

  // 2PC protocol
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Abort(AbortRequest) returns (AbortResponse);

  // Shard metadata
  rpc GetCurrentTime(GetCurrentTimeRequest) returns (GetCurrentTimeResponse);
}

// Transaction Read
message TxReadRequest {
  string tx_id = 1;
  string key = 2;
  uint64 snapshot_time = 3;  // HLC timestamp for snapshot read
}

message TxReadResponse {
  string value = 1;
  uint64 version = 2;
  bool found = 3;
}

// Transaction Write (buffered)
message TxWriteRequest {
  string tx_id = 1;
  string key = 2;
  string value = 3;
}

message TxWriteResponse {}

// Transaction Delete (buffered)
message TxDeleteRequest {
  string tx_id = 1;
  string key = 2;
}

message TxDeleteResponse {}

// 2PC Prepare
message PrepareRequest {
  string tx_id = 1;
  repeated WriteOp write_buffer = 2;  // Writes to prepare
  repeated string check_set = 3;       // Keys to check for conflicts
  uint64 snapshot_time = 4;            // Snapshot time for validation
}

message WriteOp {
  string key = 1;
  string value = 2;
  bool deleted = 3;
}

message PrepareResponse {
  Vote vote = 1;
  uint64 prepare_time = 2;  // HLC timestamp when prepared
}

enum Vote {
  VOTE_UNKNOWN = 0;
  VOTE_COMMIT = 1;
  VOTE_ABORT = 2;
}

// 2PC Commit
message CommitRequest {
  string tx_id = 1;
  uint64 commit_time = 2;  // Final commit HLC timestamp
}

message CommitResponse {}

// 2PC Abort
message AbortRequest {
  string tx_id = 1;
}

message AbortResponse {}

// Shard current time
message GetCurrentTimeRequest {}

message GetCurrentTimeResponse {
  uint64 time = 1;  // Current HLC timestamp
}
