
mil-db-sterotype:
  # Shard node list configuration
  shards:
    # Shard 1 configuration (primary node of replica set rs-shard1)
    shard1:
      shard_name: "shard0001"    # Official shard naming convention: shard + 4-digit number
      ip: "192.168.10.11"       # Private IP address of shard 1 server
      port: 27018                # MongoDB service port (avoid default 27017 for shard nodes)
      replica_set: "rs-shard1"   # Replica set name for high availability (required in production)
      priority: 1                # Replica set node priority (1 = primary node)
    # Shard 2 configuration (primary node of replica set rs-shard2)
    shard2:
      shard_name: "shard0002"
      ip: "192.168.10.12"
      port: 27019
      replica_set: "rs-shard2"
      priority: 1
